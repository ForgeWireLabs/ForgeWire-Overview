<svg xmlns="http://www.w3.org/2000/svg" width="640" height="302" viewBox="0 0 360 170" role="img" aria-labelledby="title desc">
  <title id="title">ForgeWire is coming soon</title>
  <desc id="desc">Private development. No public download or release date has been announced.</desc>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a3e"/>
      <stop offset="1" stop-color="#142f3b"/>
    </linearGradient>
    <linearGradient id="status" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57d5e2"/>
      <stop offset="1" stop-color="#84e7d0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="358" height="168" rx="16" fill="url(#bar)" stroke="#335267" stroke-width="2"/>
  <rect x="18" y="18" width="5" height="134" rx="2.5" fill="url(#status)"/>

  <g transform="translate(38 18)">
