  <text x="38" y="83" fill="#f2f7f8" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Private development</text>
  <text x="38" y="109" fill="#adbfca" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">No public download or release date</text>
  <text x="38" y="128" fill="#adbfca" font-family="Segoe UI,Arial,sans-serif" font-size="12.5">has been announced.</text>

  <path d="M266 28h70M280 44h56M294 60h42" stroke="#4cbac4" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="257" cy="28" r="3" fill="#84e7d0"/>
  <circle cx="271" cy="44" r="3" fill="#84e7d0"/>
  <circle cx="285" cy="60" r="3" fill="#84e7d0"/>
