<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1600" viewBox="0 0 360 900" role="img" aria-labelledby="title desc">
  <title id="title">ForgeWire — Where the Mind Is Forged</title>
  <desc id="desc">Your intelligence. Your data. Your hardware. Your rules. ForgeWire coordinates modular AI work inside an operator-owned local workspace, with remote compute behind a policy gate. Coming soon.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset=".56" stop-color="#0b1b2a"/>
      <stop offset="1" stop-color="#102637"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68e2e4"/>
      <stop offset="1" stop-color="#9bf2c9"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a8c7da" stroke-opacity=".055" stroke-width=".8"/>
    </pattern>
    <pattern id="module-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#9dc5d7" stroke-opacity=".035" stroke-width=".7"/>
    </pattern>
  </defs>

  <rect width="360" height="900" rx="22" fill="url(#background)"/>
  <rect width="360" height="900" rx="22" fill="url(#grid)"/>

  <!-- Identity and release status -->
  <path d="M22 32v232" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
  <text x="36" y="42" fill="#a8bfcd" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">FORGEWIRE / INTELLIGENT WORK</text>
  <text x="35" y="100" fill="#f1f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="720" letter-spacing="-.8">Where the Mind</text>
  <text x="35" y="137" fill="#f1f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="720" letter-spacing="-.8">Is Forged</text>
  <g transform="translate(36 157)">
    <rect width="146" height="30" rx="15" fill="#183c42" stroke="#438f8b" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="3.5" fill="#9be6c7"/>
    <text x="28" y="20" fill="#c1f0dc" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1">COMING SOON</text>
  </g>
  <text x="36" y="224" fill="#d5e2e8" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="550">Your intelligence. Your data.</text>
  <text x="36" y="248" fill="#d5e2e8" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="550">Your hardware. Your rules.</text>
  <text x="36" y="279" fill="#80d9d4" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.35">SYSTEMS FIRST  ·  MODELS ARE ONE PART</text>

  <!-- Operator-owned local workspace -->
  <rect x="18" y="306" width="324" height="336" rx="14" fill="#081724" stroke="#426174" stroke-width="1.6"/>
  <rect x="25" y="313" width="310" height="322" rx="10" fill="url(#module-grid)" stroke="#172f40" stroke-width=".8"/>
  <text x="34" y="340" fill="#c0d3dc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">LOCAL WORKSPACE</text>
  <text x="34" y="359" fill="#78d8c7" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".8">OPERATOR OWNED</text>
  <path d="M34 372h292" stroke="#456273" stroke-opacity=".75"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="34" y="383" width="292" height="48" rx="8" fill="#122a39" stroke="#3b7380" stroke-width="1.1"/>
    <path d="M47 397h18v18H47zM52 402h8v8h-8z" fill="none" stroke="#80ded8" stroke-width="1.2"/>
    <text x="76" y="403" fill="#eff6f8" font-size="14" font-weight="700">MODEL</text>
    <text x="76" y="420" fill="#a5bbc5" font-size="10.5">replaceable provider</text>

    <rect x="34" y="439" width="292" height="48" rx="8" fill="#122a39" stroke="#3b7380" stroke-width="1.1"/>
    <path d="M47 453h18v18H47zM52 458h8v8h-8zM43 457h4m18 10h4" fill="none" stroke="#80ded8" stroke-width="1.2"/>
    <text x="76" y="459" fill="#eff6f8" font-size="14" font-weight="700">TOOLS</text>
    <text x="76" y="476" fill="#a5bbc5" font-size="10.5">scoped actions</text>

    <rect x="34" y="495" width="292" height="48" rx="8" fill="#122a39" stroke="#3b7380" stroke-width="1.1"/>
    <path d="M47 509h18v18H47zM52 514h8v8h-8zM43 513h4m18 10h4" fill="none" stroke="#80ded8" stroke-width="1.2"/>
    <text x="76" y="515" fill="#eff6f8" font-size="14" font-weight="700">STATE</text>
    <text x="76" y="532" fill="#a5bbc5" font-size="10.5">owned and inspectable</text>
  </g>

  <rect x="34" y="557" width="292" height="66" rx="9" fill="#102d39" stroke="#4d8f91" stroke-width="1.2"/>
  <path d="M49 576h25v27H49zM54 581h15v17H54z" fill="none" stroke="url(#signal)" stroke-width="1.4"/>
  <text x="86" y="584" fill="#eef6f7" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing=".3">BOUNDED EXECUTION</text>
  <text x="86" y="604" fill="#afc5cd" font-family="Segoe UI,Arial,sans-serif" font-size="10.5">inspectable work · clear ownership</text>

  <!-- Explicit policy boundary to a separate machine -->
  <path d="M180 642v14" stroke="#d5ad78" stroke-width="1.8" stroke-dasharray="4 4"/>
  <rect x="115" y="656" width="130" height="54" rx="10" fill="#211f1c" stroke="#c6955d" stroke-width="1.3"/>
  <path d="M132 680v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#f1c688" stroke-width="1.6"/>
  <rect x="130" y="680" width="18" height="16" rx="3" fill="#49351f" stroke="#f1c688" stroke-width="1.2"/>
  <circle cx="139" cy="687" r="1.5" fill="#ffe0ae"/>
  <text x="158" y="679" fill="#f0d2a2" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".8">POLICY GATE</text>
  <text x="158" y="696" fill="#bca987" font-family="Segoe UI,Arial,sans-serif" font-size="9.5">authorized work only</text>
  <path d="M180 710v22" stroke="#d5ad78" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M175 728l5 7 5-7" fill="none" stroke="#f1c688" stroke-width="1.8"/>

  <rect x="26" y="741" width="308" height="113" rx="12" fill="#151d23" stroke="#98794f" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="44" y="770" fill="#e9c797" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">REMOTE COMPUTE</text>
  <path d="M44 785h272" stroke="#806b4e" stroke-opacity=".8"/>
  <g fill="none" stroke="#d7b580" stroke-width="1.2">
    <rect x="45" y="800" width="22" height="10" rx="2"/><rect x="45" y="816" width="22" height="10" rx="2"/>
    <circle cx="62" cy="805" r="1.2" fill="#eed09e"/><circle cx="62" cy="821" r="1.2" fill="#eed09e"/>
  </g>
  <text x="80" y="810" fill="#e0e7e9" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Separate machine</text>
  <text x="80" y="829" fill="#b0b9bb" font-family="Segoe UI,Arial,sans-serif" font-size="10.5">Private development direction</text>
  <rect x="215" y="797" width="99" height="26" rx="13" fill="#3a3023" stroke="#9e7d4e"/>
  <text x="264.5" y="814" text-anchor="middle" fill="#f0d4aa" font-family="Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing=".45">AUTHORIZED</text>

  <text x="180" y="878" text-anchor="middle" fill="#87a0aa" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="650" letter-spacing="1.35">CONTROL STAYS VISIBLE</text>
</svg>
