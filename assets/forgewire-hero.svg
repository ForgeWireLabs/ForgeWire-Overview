<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">ForgeWire — Where the mind is forged</title>
  <desc id="desc">A systems-first environment for AI-assisted work, connecting people, models, tools, state, and execution within visible boundaries.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset=".58" stop-color="#0b2034"/>
      <stop offset="1" stop-color="#102b42"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51d5ff"/>
      <stop offset="1" stop-color="#94f0cb"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9dc5e3" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="24" fill="url(#canvas)"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>
  <path d="M80 76v368" stroke="url(#signal)" stroke-width="5" stroke-linecap="round"/>
  <text x="116" y="116" fill="#9bb5ca" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="5">FORGEWIRE · SYSTEMS FOR INTELLIGENT WORK</text>
  <text x="108" y="230" fill="#f1f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="750" letter-spacing="-2">Where the mind</text>
  <text x="108" y="324" fill="#f1f7fb" font-family="Segoe UI,Arial,sans-serif" font-size="82" font-weight="750" letter-spacing="-2">is forged.</text>
  <text x="113" y="382" fill="#b8cad7" font-family="Segoe UI,Arial,sans-serif" font-size="25">Models, tools, memory, and execution—coordinated around real work.</text>
  <text x="114" y="442" fill="#81e1d4" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">YOUR INTELLIGENCE · YOUR DATA · YOUR HARDWARE · YOUR RULES</text>
  <g fill="none" stroke="url(#signal)" stroke-width="3" stroke-opacity=".8">
    <path d="M1020 144 1195 222 1390 130M1195 222 1407 317 1510 213M1195 222 1090 355 1294 421 1407 317"/>
    <path d="M1020 144 1090 355M1390 130 1407 317" stroke-opacity=".32" stroke-dasharray="7 10"/>
  </g>
  <g fill="#0b2034" stroke="url(#signal)" stroke-width="4">
    <circle cx="1020" cy="144" r="16"/><circle cx="1195" cy="222" r="25"/>
    <circle cx="1390" cy="130" r="18"/><circle cx="1407" cy="317" r="21"/>
    <circle cx="1510" cy="213" r="14"/><circle cx="1090" cy="355" r="18"/><circle cx="1294" cy="421" r="16"/>
  </g>
  <circle cx="1195" cy="222" r="41" fill="none" stroke="#51d5ff" stroke-opacity=".23" stroke-width="2" filter="url(#glow)"/>
</svg>
